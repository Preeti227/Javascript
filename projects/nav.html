<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive Navigation Bar</title>
    <style>
        body{
            margin:0;
            font-family: Arial;
        }
        .navbar{
            display:flex;
            align-items:center;
            justify-content:space-between;
            padding: 20px 15px;
            background-color:rgb(194, 85, 85);
            color:white;
        }
        .logo{
            font-size:20px;
            font-weight:bold;
        }
        .nav-links{
            display:flex;
            gap:25px;
        }
        .nav-links a{
            color:white;
            text-decoration:none;
        }
        .nav-links a:hover{
            color:rgb(255, 195, 195);
            text-decoration:underline;
        }
        .search-box input{
            padding:5px;
        }
        .search-box button{
            padding:5px;
            cursor:pointer;
        }
        .menu-toggle{
            display:none;
            color:white;
            background:none;
        }
        @media (max-width:768px){
            .navbar {
                flex-direction: column;
                align-items: stretch;
            }
        }
    </style>
</head>

<body>
    <nav class="navbar">
        <div class="nav-top">
            <div class="logo">Preet's</div>
            <button class="menu-toggle"aria-label="menu-toggle-bar"> = 
            </button>
        </div>
        <div class="nav-links">
            <a href="#">Home</a>
            <a href="#">About</a>
            <a href="#">Services</a>
            <a href="#">Contact</a>
        </div>
        <div class="search-box">
        <input type="text" placeholder="Search...">
        <button> 🔎 </button>

    </div>

    </nav>
</body>
</html>
