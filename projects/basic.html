        .first{
            background-color:palegoldenrod;
            color:black;
        }
        #one{
           background-color:rgb(215, 191, 255);
            color:rgb(53, 0, 73); 
        }
        input[type="text"]{
            padding:5px;
        }
        button:hover{
            background-color:pink;
            border:4px dashed rgb(196, 3, 35);
            padding: 5px;
        }
        .styling{
            color:black;
            background-color: orange;
            padding: 10px 5px;
            border-color: rgb(76, 5, 5);
            border-width:3px;
            border-style:dashed;
        }
        .text{
            text-decoration: underline;
            text-transform:uppercase;
            text-align:center;
            font-family:'Courier New', Courier, monospace;
            font-style: italic;
            font-weight:bold;
            font-size: 60px;
            line-height: 100px;
        }
        .container{
            display:flex;
            flex-direction: row;
            justify-content:center;
            /*align-items:center;*/
            gap:10px;
            border:1px solid black;
        }
        .box{
            height:100px;
            width:100px;
            border: black 2px solid;
            margin: 3px;
        }
        .grid{
            display:grid;
            grid-template-columns: repeat(3,1fr);
            grid-template-rows: 100px 100px 500px;
            row-gap: 10px;
            column-gap:10px;
        }
        .item{
            height:100px;
            border:2px solid black;
        }
        .one{
            grid-column-start:1;
            grid-column-end:3;
        }
    </style>
</head>
